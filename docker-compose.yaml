services:
  postgres:
    image: postgres:15
    container_name: expense_postgres_deployed
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ujjwal3217/expense-backend:latest   
    container_name: expense_backend_deployed
    ports:
      - "5000:5000"
    env_file:
     - ./.env                              
    depends_on:
      - postgres
    restart: always

  frontend:
    image: ujjwal3217/expense-frontend:latest  
    container_name: expense_frontend_deployed
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: